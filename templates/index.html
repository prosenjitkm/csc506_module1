<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSC506 Module 1 - Data Structure Learning Tool</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="header-content">
            <h1>🎓 Data Structure Learning Tool</h1>
            <p class="subtitle">CSC506 - Design and Analysis of Algorithms</p>
        </div>
    </div>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Stack Section -->
        <section class="ds-section card">
            <div class="card-header">
                <h2>📚 Stack (LIFO)</h2>
                <span class="badge">Last In, First Out</span>
                <button onclick="toggleInfo('stack')" class="btn-info-small">ℹ️ When to Use</button>
            </div>
            <div class="card-body">
                <div id="stack-info" class="use-case-info" style="display: none;"></div>
                <div class="controls">
                    <input id="stack-input" type="text" placeholder="Enter a value..." class="modern-input">
                    <button onclick="pushStack()" class="btn-primary">
                        <span class="btn-icon">➕</span> Push
                    </button>
                    <button onclick="popStack()" class="btn-secondary">
                        <span class="btn-icon">➖</span> Pop
                    </button>
                    <button onclick="peekStack()" class="btn-info">
                        <span class="btn-icon">👁️</span> Peek
                    </button>
                    <button onclick="searchStack()" class="btn-search">
                        <span class="btn-icon">🔍</span> Search
                    </button>
                    <button onclick="clearStack()" class="btn-danger">
                        <span class="btn-icon">🗑️</span> Clear
                    </button>
                </div>
                <div id="stack-visual" class="visual"></div>
                <div id="stack-complexity" class="complexity-card"></div>
            </div>
        </section>

        <!-- Queue Section -->
        <section class="ds-section card">
            <div class="card-header">
                <h2>🎫 Queue (FIFO)</h2>
                <span class="badge">First In, First Out</span>
                <button onclick="toggleInfo('queue')" class="btn-info-small">ℹ️ When to Use</button>
            </div>
            <div class="card-body">
                <div id="queue-info" class="use-case-info" style="display: none;"></div>
                <div class="controls">
                    <input id="queue-input" type="text" placeholder="Enter a value..." class="modern-input">
                    <button onclick="enqueueQueue()" class="btn-primary">
                        <span class="btn-icon">➕</span> Enqueue
                    </button>
                    <button onclick="dequeueQueue()" class="btn-secondary">
                        <span class="btn-icon">➖</span> Dequeue
                    </button>
                    <button onclick="peekQueue()" class="btn-info">
                        <span class="btn-icon">👁️</span> Peek
                    </button>
                    <button onclick="searchQueue()" class="btn-search">
                        <span class="btn-icon">🔍</span> Search
                    </button>
                    <button onclick="clearQueue()" class="btn-danger">
                        <span class="btn-icon">🗑️</span> Clear
                    </button>
                </div>
                <div id="queue-visual" class="visual"></div>
                <div id="queue-complexity" class="complexity-card"></div>
            </div>
        </section>

        <!-- Linked List Section -->
        <section class="ds-section card">
            <div class="card-header">
                <h2>🔗 Linked List</h2>
                <span class="badge">Node-Based Structure</span>
                <button onclick="toggleInfo('linked_list')" class="btn-info-small">ℹ️ When to Use</button>
            </div>
            <div class="card-body">
                <div id="linked_list-info" class="use-case-info" style="display: none;"></div>
                <div class="controls">
                    <input id="ll-input" type="text" placeholder="Enter a value..." class="modern-input">
                    <button onclick="insertLL()" class="btn-primary">
                        <span class="btn-icon">➕</span> Insert
                    </button>
                    <button onclick="deleteLL()" class="btn-secondary">
                        <span class="btn-icon">➖</span> Delete
                    </button>
                    <button onclick="searchLL()" class="btn-search">
                        <span class="btn-icon">🔍</span> Search
                    </button>
                    <button onclick="clearLL()" class="btn-danger">
                        <span class="btn-icon">🗑️</span> Clear
                    </button>
                </div>
                <div id="ll-visual" class="visual"></div>
                <div id="ll-complexity" class="complexity-card"></div>
            </div>
        </section>

        <!-- Benchmark Section -->
        <section class="ds-section card benchmark-section">
            <div class="card-header">
                <h2>📊 Performance Benchmark</h2>
                <span class="badge">Predicted vs Actual Performance</span>
            </div>
            <div class="card-body">
                <div class="controls">
                    <select id="bench-ds" class="modern-select">
                        <option value="stack">Stack</option>
                        <option value="queue">Queue</option>
                        <option value="linked_list">Linked List</option>
                    </select>
                    <select id="bench-op" class="modern-select">
                        <option value="insert">Insert Operation</option>
                        <option value="delete">Delete Operation</option>
                        <option value="search">Search Operation</option>
                    </select>
                    <button onclick="runBenchmark()" class="btn-success">
                        <span class="btn-icon">🚀</span> Run Benchmark
                    </button>
                </div>
                <div id="benchmark-loading" class="loading" style="display: none;">
                    <div class="spinner"></div>
                    <p>Running performance tests...</p>
                </div>
                <div id="benchmark-output" class="benchmark-results"></div>
                <div class="chart-container">
                    <canvas id="benchmarkChart"></canvas>
                </div>
            </div>
        </section>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
